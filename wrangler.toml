name = "wang94"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# 1. Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "web-doc-truyen-db"
database_id = "ce320f32-ae04-46a6-8421-1e5fad0ae28a" # Thay bằng D1 ID thật từ npx wrangler d1 create web-doc-truyen-db

